		<!-- ANALOG CLOCKS SETUP -->
		<script>
			(()=>{
				let date = new Date();
				let hours = date.getHours();
				let minutes = date.getMinutes();
				let seconds = date.getSeconds();
				
				var secDeg = seconds * 6;
				var minuteDeg = (minutes * 6) + (seconds * .1);
				var hourDeg = (hours * 30) + (minutes * .5);
				
				var clocks = document.getElementsByClassName("analog-clock");
				
				function rotateClocks() {
					// update degrees
					secDeg += 6;
					minuteDeg += 0.1;
					hourDeg += 0.1 / 60;
					// move clocks
					for (let i = 0; i < clocks.length; i++) {
						let clock = clocks[i];
						clock.querySelector(".second").style.rotate = secDeg + "deg";
						clock.querySelector(".minute").style.rotate = minuteDeg + "deg";
						clock.querySelector(".hour").style.rotate = hourDeg + "deg";
					}
					setTimeout(rotateClocks,1000)
				}
				rotateClocks();
			})();
		</script>
